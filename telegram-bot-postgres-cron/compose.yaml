# Run it on your machine: cp .env.example .env, fill in the token, then
#   docker compose up --build
# The digest job runs on demand with:
#   docker compose run --rm digest
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  bot:
    build: .
    env_file: [.env]
    environment:
      DB_URL: postgres://postgres:local@db:5432/postgres
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      retries: 30

  digest:
    build: .
    profiles: [job]
    env_file: [.env]
    environment:
      DB_URL: postgres://postgres:local@db:5432/postgres
      MODE: digest
    depends_on:
      db: { condition: service_healthy }
