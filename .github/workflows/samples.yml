name: samples

# Publishes the images the console's "Deploy chit-chat" button starts from.
#
# The engine never runs these from here: it copies one by digest into the
# project's own registry and deploys that copy, so only images in a project's
# registry ever run. Which digest it copies is pinned in core
# (engine/internal/sample), so a push here changes nothing until core is
# released with the new digest — the summary of each run prints the digests to
# pin.
#
# Single-platform and without attestations: buildx otherwise publishes an index
# with provenance manifests in it, which is more to copy and nothing the
# cluster can use.

on:
  push:
    branches: [main]
    paths:
      - "chit-chat/**"
      - ".github/workflows/samples.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: chit-chat/${{ matrix.image }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ghcr.io/gagarin-cloud/recipes-chit-chat-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/gagarin-cloud/recipes-chit-chat-${{ matrix.image }}:latest

      - name: Print the digest to pin
        env:
          IMAGE: ghcr.io/gagarin-cloud/recipes-chit-chat-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
